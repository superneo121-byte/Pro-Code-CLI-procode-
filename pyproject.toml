[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-code-cli"
version = "1.0.0"
description = "Pro Code CLI: a terminal AI coding companion for OpenAI-compatible endpoints (default: Google AI Studio, gemini-4-hydrogen)."
readme = { text = "Pro Code CLI (`procode`): streaming terminal AI assistant with 160+ slash commands, subagents, task graphs, workspace indexing and code extraction. Standard library only.", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["cli", "ai", "llm", "gemini", "coding-assistant", "terminal"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42"]

[project.scripts]
procode = "procode:main"

[tool.setuptools]
py-modules = ["procode"]
