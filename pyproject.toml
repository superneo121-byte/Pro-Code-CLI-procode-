[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-code-cli"
version = "1.0.2"
description = "Pro Code CLI: terminal AI coding companion for any OpenAI-compatible endpoint (Google AI Studio, OpenRouter, OpenAI, Anthropic proxy, DeepSeek, Groq, xAI, Ollama/LocalAI), with local GGUF inference, permission guardrails, git auto-bootstrap and device-storage file tools."
readme = { text = "Pro Code CLI (`procode`): streaming terminal AI assistant with 180+ slash commands, multi-provider support, local GGUF models (llama-cpp-python), OpenCode-style permission gates, subagents, task graphs, workspace indexing and code extraction. Standard library only; optional gguf/crypto extras.", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["cli", "ai", "llm", "gemini", "openai", "openrouter", "anthropic", "deepseek", "groq", "xai", "ollama", "gguf", "llama-cpp", "coding-assistant", "terminal"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42"]
gguf = ["llama-cpp-python>=0.2.70"]
all = ["cryptography>=42", "llama-cpp-python>=0.2.70"]

[project.scripts]
procode = "procode:main"

[tool.setuptools]
py-modules = ["procode"]
