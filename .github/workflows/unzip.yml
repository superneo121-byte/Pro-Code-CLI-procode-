name: Unzip project
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and push
        run: |
          if [ ! -f procode.zip ]; then echo "no zip, nothing to do"; exit 0; fi
          unzip -o procode.zip
          rm procode.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add Procode project files"
          git push
